groups:
  - name: coupon-business
    rules:
      - alert: CouponInventoryMismatch
        expr: coupon_conservation_gap != 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Coupon inventory conservation differs from zero
      - alert: CouponReservationStuck
        expr: coupon_pending_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Coupon reservations have remained pending
