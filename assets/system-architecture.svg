<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">Distributed coupon system architecture</title>
<desc id="desc">Merchant creates campaigns through Merchant Admin, RocketMQ and Distribution. Customer enters Gateway, which routes to Search, Engine and Settlement. Shared infrastructure includes Redis, MySQL, Elasticsearch, Canal, XXL-Job and Nacos. Only the redemption slice is runnable in this public repository.</desc>
